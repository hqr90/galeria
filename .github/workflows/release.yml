name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: FrameCast ${{ github.ref_name }}
          releaseBody: |
            Baixe `FrameCast_*_x64-setup.exe` abaixo e execute.
            Windows 10/11 x64. O instalador não é assinado, então o SmartScreen
            avisa na primeira execução: Mais informações → Executar assim mesmo.
          releaseDraft: false
          args: --target x86_64-pc-windows-msvc
